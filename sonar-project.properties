# ==============================================================================
# SonarQube Community Server Configuration
# ==============================================================================

sonar.projectKey=nextcloud-video-player
sonar.projectName=nextcloud-video-player
sonar.projectVersion=0.1.0

# Paths
sonar.sources=appinfo,lib,js,css,templates
sonar.tests=tests

# Exclusions
sonar.exclusions=**/vendor/**, **/node_modules/**, **/openspec/**, **/.agents/**, **/wiki/**, **/build/**, **/coverage/**, **/dist/**
sonar.coverage.exclusions=tests/**, **/appinfo/**, **/templates/**

# Coverage Reports (PHPUnit Clover & Vitest LCOV)
sonar.php.coverage.reportPaths=build/logs/clover.xml
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
